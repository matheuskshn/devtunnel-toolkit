sonar.projectKey=devtunnel-toolkit
sonar.projectName=DevTunnel Toolkit
sonar.sources=Dockerfile,docker,images,.github/scripts,.github/workflows,compose.yml,compose.route-proxy.yml,compose.system-dns.yml,.github/dependabot.yml,release-please-config.json,.release-please-manifest.json
sonar.tests=images/hub/tests,.github/scripts
sonar.test.inclusions=images/hub/tests/**,.github/scripts/**/*.test.mjs,.github/scripts/*-smoke.mjs
sonar.exclusions=images/hub/tests/**,**/*.test.mjs,.github/scripts/*-smoke.mjs,**/node_modules/**,**/dist/**,**/coverage/**,**/assets/**,**/.env*,**/data/**,**/runtime/**
sonar.scanner.excludeHiddenFiles=true
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=images/hub/coverage/lcov.info
sonar.qualitygate.wait=true
# Set sonar.projectVersion and sonar.scm.revision from the actual release/commit
# at invocation time. Keep SONAR_HOST_URL and SONAR_TOKEN outside this file.
# Source exclusions are generated files, dependencies and runtime data, never
# issue/coverage suppressions. Hidden automation paths are explicitly included.
