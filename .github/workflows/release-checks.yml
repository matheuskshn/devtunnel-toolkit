name: Suite checks
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      container:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  security:
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ inputs.ref }}
      scan-images: ${{ inputs.container }}
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: images/hub/package-lock.json
      - run: node .github/scripts/release-policy.mjs
      - run: node --test .github/scripts/*.test.mjs
      - run: bash -n docker/devtunnel-entrypoint images/squid/squid-entrypoint images/tinyproxy/tinyproxy-entrypoint images/openvpn/openvpn-entrypoint
      - run: npm ci --ignore-scripts
        working-directory: images/hub
      - run: npm run test:coverage && npm run check:public && npm audit --audit-level=low
        working-directory: images/hub
      - if: inputs.container
        run: docker build -t devtunnel-toolkit-hub:local images/hub
      - if: inputs.container
        run: npm run test:container
        working-directory: images/hub
      - if: inputs.container
        run: npm run test:postgres
        working-directory: images/hub
