name: Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: ./.github/workflows/security.yml
  changes:
    uses: ./.github/workflows/image-changes.yml
    permissions:
      contents: read
  build:
    needs: [changes, security]
    permissions:
      contents: read
      packages: write
    if: needs.changes.outputs.legacy == 'true'
    name: Build ${{ matrix.title }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    uses: ./.github/workflows/native-image.yml
    with:
      image: ${{ matrix.image }}
      ref: ${{ github.sha }}
      publish: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
