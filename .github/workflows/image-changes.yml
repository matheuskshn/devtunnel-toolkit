name: Select changed images
on:
  workflow_call:
    outputs:
      matrix:
        value: ${{ jobs.changes.outputs.matrix }}
      legacy:
        value: ${{ jobs.changes.outputs.legacy }}
      hub:
        value: ${{ jobs.changes.outputs.hub }}
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      legacy: ${{ steps.select.outputs.legacy }}
      hub: ${{ steps.select.outputs.hub }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: node --test .github/scripts/image-changes.test.mjs
      - id: select
        run: node .github/scripts/image-changes.mjs
