name: Release suite
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release or resume (published versions are refused)
        type: string
        required: true
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release-suite.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      ref: ${{ inputs.tag || github.sha }}
    secrets: inherit
