name: Native image build and publication
on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      ref:
        type: string
        required: true
      publish:
        type: boolean
        default: false
      mode:
        type: string
        default: edge
      tag:
        type: string
        default: ""
permissions:
  contents: read
env:
  PUBLICATION_IMAGE: ${{ inputs.image }}
  PUBLICATION_MODE: ${{ inputs.mode }}
  RELEASE_TAG: ${{ inputs.tag }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      context: ${{ steps.plan.outputs.context }}
      dockerfile: ${{ steps.plan.outputs.dockerfile }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      repository: ${{ steps.plan.outputs.repository }}
      exists: ${{ steps.plan.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - if: inputs.mode == 'release'
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - if: inputs.mode == 'release' && inputs.publish && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: plan
        run: node .github/scripts/native-publication.mjs plan
  build:
    needs: plan
    if: needs.plan.outputs.exists != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04, machine: x86_64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, machine: aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Require native execution for sanitizers and upstream regressions
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "$EXPECTED_MACHINE"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - if: inputs.publish && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ needs.plan.outputs.context }}
          file: ${{ needs.plan.outputs.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ needs.plan.outputs.repository }},push-by-digest=true,name-canonical=true,push=${{ inputs.publish && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
          labels: |
            org.opencontainers.image.title=${{ inputs.image }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ inputs.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}-${{ matrix.arch }}
      - name: Record exact architecture digest
        if: inputs.publish && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
        env:
          NATIVE_ARCH: ${{ matrix.arch }}
          NATIVE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p native-digests
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; const {NATIVE_ARCH: arch,NATIVE_DIGEST: digest}=process.env; if(!/^(amd64|arm64)$/.test(arch)||!/^sha256:[a-f0-9]{64}$/.test(digest))throw Error("INVALID_NATIVE_DIGEST"); writeFileSync(`native-digests/${arch}.json`,JSON.stringify({arch,digest}));'
      - if: inputs.publish && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ inputs.image }}--${{ matrix.arch }}
          path: native-digests/*.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [plan, build]
    if: inputs.publish && needs.plan.outputs.exists != 'true' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-${{ inputs.image }}--*
          path: native-digests
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: inputs.mode == 'edge' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Install checksum-verified security tools
        run: bash .github/scripts/install-security-tools.sh "$RUNNER_TEMP/security-tools"
      - name: Scan the exact native digests before tag promotion
        env:
          IMAGE_REPOSITORY: ${{ needs.plan.outputs.repository }}
        run: |
          for arch in amd64 arm64; do
            digest=$(jq -er --arg arch "$arch" 'select(.arch == $arch) | .digest | select(test("^sha256:[a-f0-9]{64}$"))' "native-digests/$arch.json")
            "$RUNNER_TEMP/security-tools/trivy" image --image-src remote \
              --cache-dir "$RUNNER_TEMP/native-trivy-cache" --timeout 10m \
              --platform "linux/$arch" --scanners vuln --severity HIGH,CRITICAL \
              --exit-code 1 "$IMAGE_REPOSITORY@$digest"
          done
      - name: Merge and verify both architectures and attestations before promotion
        run: node .github/scripts/native-publication.mjs merge
