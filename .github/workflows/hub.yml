name: Hub build and publish
on:
  pull_request:
    paths:
      [
        "images/hub/**",
        ".github/workflows/**",
        ".github/scripts/**",
        "version.txt",
        "release-please-config.json",
        ".release-please-manifest.json",
      ]
  push:
    branches: [main]
    paths:
      [
        "images/hub/**",
        ".github/workflows/**",
        ".github/scripts/**",
        "version.txt",
        "release-please-config.json",
        ".release-please-manifest.json",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hub-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  security:
    uses: ./.github/workflows/security.yml
  changes:
    uses: ./.github/workflows/image-changes.yml
  test:
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: images/hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: images/hub/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node .github/scripts/release-policy.mjs
        working-directory: .
      - run: npm run check:public
      - run: npm run test:coverage
      - run: npm audit --audit-level=low
      - if: needs.changes.outputs.hub == 'true'
        run: docker build -t devtunnel-toolkit-hub:local .
      - if: needs.changes.outputs.hub == 'true'
        run: npm run test:container
      - if: needs.changes.outputs.hub == 'true'
        run: npm run test:postgres
  native:
    needs: [changes, test, security]
    if: needs.changes.outputs.hub == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/native-image.yml
    with:
      image: devtunnel-toolkit-hub
      ref: ${{ github.sha }}
      publish: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    secrets: inherit
