name: Hub build and publish
on:
  pull_request:
    paths: ["images/hub/**", ".github/workflows/**", ".github/scripts/**", "version.txt", "release-please-config.json", ".release-please-manifest.json"]
  push:
    branches: [main]
    paths: ["images/hub/**", ".github/workflows/**", ".github/scripts/**", "version.txt", "release-please-config.json", ".release-please-manifest.json"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hub-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    uses: ./.github/workflows/image-changes.yml
  test:
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: images/hub
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: images/hub/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node .github/scripts/release-policy.mjs
        working-directory: .
      - run: npm run check:public
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - if: needs.changes.outputs.hub == 'true'
        run: docker build -t devtunnel-toolkit-hub:local .
      - if: needs.changes.outputs.hub == 'true'
        run: npm run test:container
  architectures:
    needs: [changes, test]
    if: needs.changes.outputs.hub == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: images/hub
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=devtunnel-toolkit-hub
          cache-to: type=gha,mode=max,scope=devtunnel-toolkit-hub
  publish:
    needs: [test, architectures]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Resolve image names
        id: images
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          dockerhub_namespace="${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USERNAME}"
          dockerhub_namespace="${dockerhub_namespace,,}"
          {
            echo "images<<EOF"
            echo "ghcr.io/${owner}/devtunnel-toolkit-hub"
            if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" && -n "$dockerhub_namespace" ]]; then
              echo "docker.io/${dockerhub_namespace}/devtunnel-toolkit-hub"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.images }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.title=devtunnel-toolkit-hub
            org.opencontainers.image.description=Multi-session Dev Tunnels host with a shared Squid proxy
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Build and publish Hub image
        uses: docker/build-push-action@v7
        with:
          context: images/hub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=devtunnel-toolkit-hub
          cache-to: type=gha,mode=max,scope=devtunnel-toolkit-hub
          provenance: true
          sbom: true
