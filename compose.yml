name: devtunnel-toolkit

services:
  devtunnel:
    image: ${DEVTUNNEL_IMAGE:-devtunnel-toolkit:local}
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    dns:
      - "${DEVTUNNEL_DNS_PRIMARY:-1.1.1.1}"
      - "${DEVTUNNEL_DNS_SECONDARY:-8.8.8.8}"
      - "${DEVTUNNEL_DNS_FALLBACK:-127.0.0.1}"
    extra_hosts:
      - "localhost:127.0.0.1"
    restart: unless-stopped
    depends_on:
      squid:
        condition: service_healthy
      openvpn:
        condition: service_healthy
    volumes:
      - devtunnel-home:/home/devtunnel
      - type: bind
        source: "${LOCAL_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}"
        target: "${CONTAINER_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}"
        read_only: true
        bind:
          create_host_path: false
    environment:
      PORTS: "${PORTS:-3140,53194}"
      TUNNEL_ID: "${TUNNEL_ID:-}"
      DEVTUNNEL_ACCESS_TOKEN: "${DEVTUNNEL_ACCESS_TOKEN:-}"
      ALLOW_ANONYMOUS: "${ALLOW_ANONYMOUS:-false}"
      PROTOCOL: "${PROTOCOL:-}"
      EXPIRATION: "${EXPIRATION:-}"
      VERBOSE: "${VERBOSE:-false}"
      LOGIN_PROVIDER: "${LOGIN_PROVIDER:-microsoft}"
      DEVTUNNEL_EXIT_ON_UNAUTHORIZED: "${DEVTUNNEL_EXIT_ON_UNAUTHORIZED:-true}"
      DEVTUNNEL_UNAUTHORIZED_EXIT_CODE: "${DEVTUNNEL_UNAUTHORIZED_EXIT_CODE:-75}"
      DEVTUNNEL_EXIT_TERMINATION_GRACE_SECONDS: "${DEVTUNNEL_EXIT_TERMINATION_GRACE_SECONDS:-10}"
    command: ["host"]

  devtunnel-renew:
    image: ${DEVTUNNEL_IMAGE:-devtunnel-toolkit:local}
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    dns:
      - "${DEVTUNNEL_DNS_PRIMARY:-1.1.1.1}"
      - "${DEVTUNNEL_DNS_SECONDARY:-8.8.8.8}"
      - "${DEVTUNNEL_DNS_FALLBACK:-127.0.0.1}"
    extra_hosts:
      - "localhost:127.0.0.1"
    restart: unless-stopped
    volumes:
      - devtunnel-home:/home/devtunnel
      - type: bind
        source: "${LOCAL_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}"
        target: "${CONTAINER_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}"
        read_only: true
        bind:
          create_host_path: false
    environment:
      TUNNEL_ID: "${TUNNEL_ID:-}"
      DEVTUNNEL_ACCESS_TOKEN: "${DEVTUNNEL_ACCESS_TOKEN:-}"
      DEVTUNNEL_RENEW_AFTER_EXPIRATION_SECONDS: "${DEVTUNNEL_RENEW_AFTER_EXPIRATION_SECONDS:-60}"
      DEVTUNNEL_RENEW_FALLBACK_INTERVAL_SECONDS: "${DEVTUNNEL_RENEW_FALLBACK_INTERVAL_SECONDS:-29700}"
      DEVTUNNEL_RENEW_RETRY_SECONDS: "${DEVTUNNEL_RENEW_RETRY_SECONDS:-300}"
      DEVTUNNEL_RENEW_MIN_SLEEP_SECONDS: "${DEVTUNNEL_RENEW_MIN_SLEEP_SECONDS:-30}"
      VERBOSE: "${VERBOSE:-false}"
      LOGIN_PROVIDER: "${LOGIN_PROVIDER:-microsoft}"
    command: ["renew"]

  squid:
    image: ${SQUID_IMAGE:-devtunnel-toolkit-squid:local}
    build:
      context: .
      dockerfile: images/squid/Dockerfile
    network_mode: host
    volumes:
      - type: bind
        source: "${LOCAL_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}"
        target: "${CONTAINER_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}"
        read_only: true
        bind:
          create_host_path: false
    environment:
      SQUID_HTTP_PORT: "${SQUID_HTTP_PORT:-3140}"
      SQUID_LISTEN_ADDRESS: "${SQUID_LISTEN_ADDRESS:-127.0.0.1}"
      SQUID_VISIBLE_HOSTNAME: "${SQUID_VISIBLE_HOSTNAME:-devtunnel-toolkit-squid}"
      SQUID_SSL_PORTS: "${SQUID_SSL_PORTS:-443 563 22}"
      SQUID_SAFE_PORTS: "${SQUID_SAFE_PORTS:-80 21 22 443 70 210 1025-65535 280 488 591 777}"
      SQUID_EXTRA_CONFIG: "${SQUID_EXTRA_CONFIG:-}"
    healthcheck:
      test: ["CMD-SHELL", "squid -k check -f /tmp/squid.conf >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  openvpn:
    image: ${OPENVPN_IMAGE:-devtunnel-toolkit-openvpn:local}
    build:
      context: .
      dockerfile: images/openvpn/Dockerfile
    network_mode: service:openvpn-network
    depends_on:
      openvpn-network:
        condition: service_healthy
        restart: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - openvpn-data:/etc/openvpn
      - type: bind
        source: "${LOCAL_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}"
        target: "${CONTAINER_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}"
        read_only: true
        bind:
          create_host_path: false
    environment:
      OVPN_PORT: "${OVPN_PORT:-53194}"
      # OVPN_LISTEN_ADDRESS controls the host publication above, not this bridge.
      OVPN_LISTEN_ADDRESS: "0.0.0.0"
      OVPN_PROTO: "${OVPN_PROTO:-tcp}"
      OVPN_NETWORK: "${OVPN_NETWORK:-10.8.0.0}"
      OVPN_NETMASK: "${OVPN_NETMASK:-255.255.255.0}"
      OVPN_CIDR: "${OVPN_CIDR:-10.8.0.0/24}"
      OVPN_CLIENT_NAME: "${OVPN_CLIENT_NAME:-devtunnel-toolkit}"
      OVPN_REMOTE_HOST: "${OVPN_REMOTE_HOST:-127.0.0.1}"
      OVPN_REMOTE_PORT: "${OVPN_REMOTE_PORT:-53194}"
      OVPN_PUSH_ROUTES: "${OVPN_PUSH_ROUTES:-10.0.0.0 255.0.0.0,172.16.0.0 255.240.0.0,192.168.0.0 255.255.0.0}"
      OVPN_DNS: "${OVPN_DNS:-}"
      OVPN_REDIRECT_GATEWAY: "${OVPN_REDIRECT_GATEWAY:-false}"
      OVPN_EXTRA_CONFIG: "${OVPN_EXTRA_CONFIG:-}"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          ip addr show tun0 >/dev/null 2>&1 &&
          { if [ "$${OVPN_PROTO}" = udp ]; then ss -lun; else ss -ltn; fi; }
          | grep -q ":$${OVPN_PORT} "
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  openvpn-network:
    image: ${OPENVPN_IMAGE:-devtunnel-toolkit-openvpn:local}
    build:
      context: .
      dockerfile: images/openvpn/Dockerfile
    # Bootstrap only: then exec a non-root, capability-free namespace keeper.
    # No server PKI mount, host networking, or privileged mode.
    user: "0:0"
    entrypoint: [/usr/local/bin/openvpn-entrypoint]
    ports:
      - target: ${OVPN_PORT:-53194}
        published: "${OVPN_PORT:-53194}"
        host_ip: "${OVPN_LISTEN_ADDRESS:-127.0.0.1}"
        protocol: ${OVPN_PROTO:-tcp}
    sysctls:
      net.ipv4.ip_forward: "1"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/run:mode=755, /etc/openvpn:mode=000]
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      OVPN_NETWORK: "${OVPN_NETWORK:-10.8.0.0}"
      OVPN_NETMASK: "${OVPN_NETMASK:-255.255.255.0}"
      OVPN_CIDR: "${OVPN_CIDR:-10.8.0.0/24}"
    command: [network]
    healthcheck:
      test:
        [
          CMD-SHELL,
          "ip -4 address show dev tun0 | grep -q 'inet ' && grep -Eq '^Uid:[[:space:]]+10001' /proc/1/status && grep -Eq '^CapEff:[[:space:]]+0+$$' /proc/1/status",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

volumes:
  devtunnel-home:
  openvpn-data:
